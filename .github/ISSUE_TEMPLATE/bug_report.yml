name: 缺陷报告
description: 报告可复现的问题
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: 请勿上传真实业务图片、识别正文、口令或个人路径。
  - type: input
    id: version
    attributes:
      label: 应用版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与硬件
      description: Windows 版本、处理器及内存容量。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 错误代码或公开样例
