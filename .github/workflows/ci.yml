name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-quality.lock
      - name: Install development dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-quality.lock
      - name: Test
        run: python -B -m pytest -q
      - name: Native release dialog checks
        env:
          QT_QPA_PLATFORM: windows
        run: python -B -m pytest -q tests/test_releases.py
      - name: Check core and release tools
        run: |
          python -m ruff check src/offline_word/domain.py src/offline_word/security.py src/offline_word/images.py src/offline_word/text_enhancement.py src/offline_word/exporter.py src/offline_word/release_dialog.py tools/build_source_release.py tools/sync_changelog.py tools/benchmark_degraded_ocr.py tests/test_source_release.py tests/test_text_enhancement.py
          python -m pyright
          python -B -m tools.sync_changelog --check
